services:
  docling:
    image: docling-serve-cpu-libreoffice:latest
    container_name: docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_ENABLE_API_DOCS=true
      - DOCLING_SERVE_LOG_LEVEL=INFO
      - DOCLING_SERVE_LOAD_MODELS_AT_BOOT=true
      - DOCLING_SERVE_ENG_LOC_NUM_WORKERS=1
      - DOCLING_SERVE_ENG_LOC_SHARE_MODELS=true
      - DOCLING_SERVE_OPTIONS_CACHE_SIZE=2
      - DOCLING_NUM_THREADS=4
      - DOCLING_DEVICE=cpu
    volumes:
      - docling-cache:/opt/app-root/src/.cache
    mem_limit: 6g
    memswap_limit: 6g
    shm_size: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

volumes:
  docling-cache:
